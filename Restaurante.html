<!DOCTYPE html>

  <head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
    .slide {
      position: relative;
      width: 100%;
      height: 180px;
      overflow: hidden;
      border-radius: 15px;
      margin-bottom: 15px;
    }
     .slide img {
       position: absolute;
       width: 100%;
       height: 100%;
       object-fit: cover;
       
       opacity: 0;
       animation: slide 10s infinite;
     }
     .slide img:nth-child(1) {
       animation-delay: 0s;
       padding: 5px;
     }
     .slide img:nth-child(2) {
       animation-delay: 4.5s;
       padding: 5px;
     }
 @keyframes slide {

    0% {
       transform: translateX(100%);
       opacity: 0;
    }

    10% {
      transform: translateX(0);
      opacity: 1;
    }

    35% {
      transform: translateX(0);
      opacity: 1;
    }

    45% {
      transform: translateX(-100%);
      opacity: 0;
    }

    100% {
      transform: translateX(-100%);
      opacity: 0;
    }

  }

      .container {
